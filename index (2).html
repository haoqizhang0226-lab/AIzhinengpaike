<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>教师排课管理</title>
  <link rel="stylesheet" href="workspace.css">
  <link rel="stylesheet" href="approval-tier.css">
  <link rel="stylesheet" href="grouped.css">
  <link rel="stylesheet" href="embedded.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <div class="breadcrumb">教师管理 <span>／</span> 教师排课管理</div>
    <div class="page-heading"><h1>教师排课管理</h1><button type="button" class="button button-primary" id="addTeacherRule">＋ 新增教师排课规则</button></div>
    <div id="groupList" class="group-list" aria-label="老师规则列表"></div>
  </main>

  <div class="drawer-backdrop" id="drawerBackdrop" hidden>
    <aside class="rule-drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
      <header class="drawer-header"><div><h2 id="drawerTitle">编辑基本信息</h2></div><button type="button" class="icon-button" id="closeDrawer" aria-label="关闭">×</button></header>
      <div class="drawer-body">
        <div id="groupFields">
          <label class="group-name-field" for="editGroupName"><span>规则名称</span><input id="editGroupName" type="text" maxlength="40"></label>
          <section class="drawer-section"><div class="section-heading"><div><h3>适用课程项</h3></div></div><div class="course-picker" id="courseChoices"></div></section>
        </div>
        <div id="entryFields" hidden>
          <div class="entry-parent" id="entryParent"></div>
          <section class="drawer-section"><div class="section-heading"><div><h3 id="entryConditionTitle">授课校区</h3></div></div><div class="option-grid" id="entryConditionChoices"></div></section>
          <section class="drawer-section"><div class="section-heading"><div><h3>教师组织优先级</h3></div></div><div class="priority-list" id="entryPriorityList"></div><button type="button" class="add-priority" id="addTier">＋ 添加教师架构</button></section>
        </div>
        <div class="drawer-validation" id="drawerValidation" hidden></div>
      </div>
      <footer class="drawer-footer"><div><button type="button" class="button button-quiet" id="cancelDrawer">取消</button><button type="button" class="button button-danger" id="deleteGroup">删除</button><button type="button" class="button button-primary" id="saveGroup">保存规则</button></div></footer>
    </aside>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><header><h2 id="modalTitle"></h2><button type="button" class="icon-button" id="closeModal" aria-label="关闭">×</button></header><div class="modal-body" id="modalBody"></div><footer id="modalActions"></footer></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
