  <style>
    *{box-sizing:border-box}html{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;color:#273952;background:#f5f8fc}body{margin:0;min-width:320px}button{font:inherit;cursor:pointer}button:disabled{cursor:not-allowed}a{text-decoration:none}
    .scheme-page{max-width:1440px;margin:auto;padding:24px 28px 130px}.scheme-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:18px}.scheme-heading h1{margin:4px 0 8px;font-size:22px}.scheme-heading p{margin:0;color:#788aa2;font-size:12px;line-height:1.7}.scheme-return{padding:8px 14px;border:1px solid #bcd4f3;border-radius:4px;background:#fff;color:#3378d4;font-size:12px;white-space:nowrap}
    .scheme-overview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;padding:18px 22px;border:1px solid #e2eaf4;border-radius:7px;background:#fff}.scheme-overview div{min-width:0}.scheme-overview small{display:block;margin-bottom:7px;color:#8190a4;font-size:11px}.scheme-overview strong{font-size:13px;font-weight:600;line-height:1.5}.scheme-overview .wide{grid-column:span 2}.scheme-overview .wide strong{font-weight:400}
    .scheme-workspace{display:grid;grid-template-columns:minmax(0,1fr) 294px;gap:18px;align-items:start;margin-top:18px}.scheme-course{margin-bottom:16px;overflow:hidden;border:1px solid #e1eaf5;border-radius:8px;background:#fff}.scheme-course-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid #e5ecf5}.scheme-course-head h2{margin:0;font-size:15px}.scheme-course-head h2::before{display:inline-block;width:4px;height:15px;margin-right:9px;border-radius:3px;background:#347ef3;vertical-align:-2px;content:""}.scheme-course-head span{color:#7488a3;font-size:12px}.scheme-card-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:16px}.scheme-card{position:relative;min-width:0;padding:16px;border:1px solid #dce7f4;border-radius:7px;background:#fbfdff;transition:border-color .15s,box-shadow .15s}.scheme-card:hover{border-color:#a8c8f2}.scheme-card.chosen{border-color:#3986ef;background:#f8fbff;box-shadow:0 0 0 2px #3986ef18}.scheme-card.chosen::after{position:absolute;top:12px;right:12px;display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#3585ef;color:#fff;font-size:12px;content:"✓"}.scheme-card-head{display:flex;justify-content:space-between;gap:12px;padding-right:22px}.scheme-card-head strong{display:block;font-size:13px}.scheme-card-head small{display:block;margin-top:5px;color:#8796a8;font-size:11px}.scheme-card-head button{align-self:flex-start;padding:0;border:0;background:none;color:#3179db;font-size:11px;white-space:nowrap}.scheme-card-meta{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin:13px 0}.scheme-card-meta span{padding:3px 7px;border-radius:3px;background:#eaf2ff;color:#3977c5;font-size:11px}.scheme-card-meta .partial{background:#fff1e3;color:#b9782e}.scheme-count{display:flex;align-items:baseline;gap:8px;margin-bottom:11px}.scheme-count b{color:#214f87;font-size:17px}.scheme-count small{color:#8796a8;font-size:11px}.scheme-slot-preview{min-height:58px;padding:9px 10px;border-radius:4px;background:#f1f6fd}.scheme-slot-preview div{display:flex;justify-content:space-between;gap:10px;margin:4px 0;color:#536d8c;font-size:11px}.scheme-slot-preview strong{font-weight:500}.scheme-card-link{margin:9px 0 13px;padding:0;border:0;background:none;color:#347fe4;font-size:11px}.scheme-select{width:100%;min-height:31px;border:1px solid #bdcff4;border-radius:4px;background:linear-gradient(90deg,#eeeaff,#e3f2ff);color:#337de7;font-size:12px}.scheme-card.chosen .scheme-select{border-color:#3484ed;background:linear-gradient(90deg,#6850f6,#2784f5);color:#fff}
    .scheme-summary{position:sticky;top:62px;padding:18px;border:1px solid #dce7f4;border-radius:8px;background:#fff;box-shadow:0 5px 18px #1d45700b}.scheme-summary h2{margin:0 0 13px;font-size:15px}.scheme-summary h2::before{display:inline-block;width:4px;height:15px;margin-right:8px;border-radius:3px;background:#7355fa;vertical-align:-2px;content:""}.scheme-summary-row{padding:11px 0;border-top:1px solid #ebf0f7}.scheme-summary-row small{display:block;color:#7d8da3;font-size:11px}.scheme-summary-row strong{display:block;margin-top:5px;font-size:12px;line-height:1.5}.scheme-summary-row em{display:block;margin-top:4px;color:#66809e;font-size:11px;font-style:normal}.scheme-summary-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:10px 0;padding:13px 4px;border-radius:5px;background:#f1f6fc;text-align:center}.scheme-summary-metrics strong{display:block;font-size:16px}.scheme-summary-metrics small{display:block;margin-top:4px;color:#8290a4;font-size:10px}.scheme-warning{margin:12px 0;padding:10px;border-radius:4px;background:#fff4ea;color:#a76a28;font-size:11px;line-height:1.6}.scheme-warning.ok{background:#ecf9f1;color:#258353}.scheme-confirm{width:100%;min-height:38px;border:0;border-radius:4px;background:linear-gradient(90deg,#6851f8,#2982f4);color:#fff;font-size:12px;font-weight:600}.scheme-confirm:disabled{background:#c4cfdf;color:#fff}.scheme-summary-note{margin:9px 0 0;color:#99a6b8;font-size:10px;line-height:1.5}
    .scheme-dialog{width:min(780px,calc(100vw - 50px));max-height:calc(100dvh - 60px);padding:0;border:1px solid #dfe8f4;border-radius:8px;box-shadow:0 22px 70px #172c4a42;color:#2b405d}.scheme-dialog::backdrop{background:#1d345d7a}.scheme-dialog.wide{width:min(1040px,calc(100vw - 50px))}.scheme-dialog header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 21px;border-bottom:1px solid #e5ebf3;background:#fff}.scheme-dialog h2{margin:0;font-size:16px}.scheme-dialog header button{width:29px;height:29px;border:0;border-radius:4px;background:#edf4ff;color:#3d7ed7;font-size:20px}.scheme-dialog-body{max-height:calc(100dvh - 175px);overflow:auto;padding:20px}.scheme-detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.scheme-detail-grid div{padding:12px;border-radius:5px;background:#f5f8fd}.scheme-detail-grid small{display:block;margin-bottom:6px;color:#8090a6;font-size:11px}.scheme-detail-grid strong{font-size:12px;line-height:1.5}.scheme-dialog p{margin:15px 0 0;color:#667c97;font-size:12px;line-height:1.7}.scheme-table-wrap{overflow:auto}.scheme-table{width:100%;min-width:660px;border-collapse:collapse;font-size:12px}.scheme-table th,.scheme-table td{padding:11px;border:1px solid #e2e9f2;text-align:left;white-space:nowrap}.scheme-table th{background:#f4f7fc;color:#5b7290}.scheme-table tr:nth-child(even) td{background:#fbfcfe}.scheme-dialog footer{display:flex;justify-content:flex-end;padding:12px 20px;border-top:1px solid #e5ebf3}.scheme-dialog footer button{min-height:32px;padding:0 18px;border:1px solid #b9d2f3;border-radius:4px;background:#fff;color:#3479d4}
    @media(max-width:1250px){.scheme-workspace{grid-template-columns:1fr}.scheme-summary{position:static}.scheme-summary-row{display:inline-block;width:50%;vertical-align:top}.scheme-card-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:850px){.scheme-page{padding:16px 14px 100px}.scheme-overview{grid-template-columns:repeat(2,minmax(0,1fr))}.scheme-overview .wide{grid-column:span 2}.scheme-card-grid{grid-template-columns:1fr}.scheme-detail-grid{grid-template-columns:repeat(2,1fr)}}

<body class="sales-workspace prototype-nav-active">
  <nav class="prototype-global-nav" aria-label="工作台切换"><div class="workspace-tabs"><a class="workspace-tab active" href="index.html#smart-consult" aria-current="page">销售工作台</a><a class="workspace-tab" href="教务端/index.html">教务工作台</a><a class="workspace-tab" href="homeroom-workspace.html">班主任工作台</a><a class="workspace-tab" href="teaching-workspace.html">教学工作台</a><a class="workspace-tab" href="dingtalk-workspace.html">钉钉工作台</a><a class="workspace-tab" href="wecom-sidebar.html">企微侧边栏</a><a class="workspace-tab" href="business-flow.html">业务流程</a><a class="workspace-tab" href="scheduling-algorithm.html">排课算法</a></div></nav>
  <main id="consultPlanDemoPage" class="scheme-page" aria-label="确认售前咨单方案">
    <div class="scheme-heading"><div><h1>确认售前咨单方案</h1><p>每位老师对应一套本科目可排时段。确认各科方案后，系统合并生成一张预排课表。</p></div><a class="scheme-return" href="index.html#smart-consult">返回售前咨单</a></div>
    <section class="scheme-overview" aria-label="咨单概要"><div><small>客户</small><strong>陈同学（VA100086215）</strong></div><div><small>课程</small><strong>英联邦学科 · ALEVEL</strong></div><div><small>计划日期</small><strong>2026-11-16 至 2026-12-20</strong></div><div><small>课程总量</small><strong>2 科 · 8 节 · 16 课时</strong></div><div class="wide"><small>排课时间要求</small><strong>每周安排 2～3 节；工作日 18:30 后优先，避免同一天的课程时间重叠。</strong></div></section>
    <div class="scheme-workspace"><div id="schemeCourses"></div><aside id="schemeSummary" class="scheme-summary" aria-label="方案合并预览"></aside></div>
  </main>
  <dialog id="schemeDialog" class="scheme-dialog"><header><h2 id="schemeDialogTitle"></h2><button type="button" data-dialog-close aria-label="关闭">×</button></header><div id="schemeDialogBody" class="scheme-dialog-body"></div><footer><button type="button" data-dialog-close>关闭</button></footer></dialog>
  <script>
    (()=>{
      const $=selector=>document.querySelector(selector);
      const safe=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      const weekday=date=>['周日','周一','周二','周三','周四','周五','周六'][new Date(date+'T00:00:00').getDay()];
      const shortDate=date=>date.slice(5).replace('-','.');
      const courses=[
        {id:'business',name:'商务',board:'OCR',grade:'AS',mode:'线上',campus:'--',required:4,plans:[
          {id:'B01',teacher:'郑扬扬（VA000755）',role:'全职 · 英联邦学科',level:'普通教师',style:'循序善诱、疑难专家',slots:[['2026-11-17','18:30','20:30'],['2026-11-24','18:30','20:30'],['2026-12-01','18:30','20:30'],['2026-12-08','18:30','20:30']]},
          {id:'B02',teacher:'崔昕瑜（VA001736）',role:'兼职 · 英联邦学科',level:'普通教师',style:'温柔耐心、循序善诱',slots:[['2026-11-19','18:30','20:30'],['2026-11-26','18:30','20:30'],['2026-12-03','18:30','20:30']]}
        ]},
        {id:'accounting',name:'会计',board:'EDX',grade:'AS',mode:'线下',campus:'舜元中心',required:4,plans:[
          {id:'C01',teacher:'王紫（VA001968）',role:'全职 · 英联邦学科',level:'普通教师',style:'循序善诱、热情活泼',slots:[['2026-11-17','18:30','20:30'],['2026-11-25','18:30','20:30'],['2026-12-02','18:30','20:30'],['2026-12-09','18:30','20:30']]},
          {id:'C02',teacher:'荷超（VA000144）',role:'全职 · 英联邦学科',level:'金牌教师',style:'严格严肃、可全英文',slots:[['2026-11-18','18:30','20:30'],['2026-11-25','18:30','20:30'],['2026-12-02','18:30','20:30'],['2026-12-09','18:30','20:30']]}
        ]}
      ];
      const chosen={business:'B01',accounting:'C01'};
      const planFor=course=>course.plans.find(plan=>plan.id===chosen[course.id]);
      const lessons=()=>courses.flatMap(course=>{const plan=planFor(course);return plan?plan.slots.map(([date,start,end])=>({date,start,end,course,teacher:plan.teacher,planId:plan.id})):[]}).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
      const conflicts=rows=>rows.flatMap((a,i)=>rows.slice(i+1).filter(b=>a.date===b.date&&a.start<b.end&&b.start<a.end).map(b=>({a,b})));
      function render(){
        $('#schemeCourses').innerHTML=courses.map(course=>`<section class="scheme-course"><header class="scheme-course-head"><h2>${safe(course.name)} <small>· ${safe(course.board)} ${safe(course.grade)}</small></h2><span>${course.required} 节 · ${course.required*2} 课时 · ${safe(course.mode)}</span></header><div class="scheme-card-grid">${course.plans.map(plan=>{const active=chosen[course.id]===plan.id;return `<article class="scheme-card ${active?'chosen':''}" data-plan="${plan.id}"><div class="scheme-card-head"><div><strong>科目方案 ${plan.id} · ${safe(plan.teacher)}</strong><small>${safe(plan.role)}</small></div><button type="button" data-teacher="${plan.id}">查看教师信息</button></div><div class="scheme-card-meta"><span>${safe(course.mode)}</span><span>${safe(course.campus)}</span>${plan.slots.length<course.required?'<span class="partial">有未安排课节</span>':''}</div><div class="scheme-count"><b>本方案安排 ${plan.slots.length} 节</b><small>共 ${plan.slots.length*2} 课时／需 ${course.required} 节</small></div><div class="scheme-slot-preview">${plan.slots.slice(0,2).map(([date,start,end])=>`<div><strong>${shortDate(date)} ${weekday(date)}</strong><span>${start}—${end}</span></div>`).join('')}</div><button type="button" class="scheme-card-link" data-slots="${plan.id}">查看全部可排时段（${plan.slots.length}） ›</button><button type="button" class="scheme-select" data-select="${plan.id}" aria-pressed="${active}">选择该方案</button></article>`}).join('')}</div></section>`).join('');
        const rows=lessons(),clashes=conflicts(rows),missing=courses.reduce((sum,course)=>sum+course.required-(planFor(course)?.slots.length||0),0);
        const message=clashes.length?`<div class="scheme-warning">${clashes.length} 处时间冲突：${shortDate(clashes[0].a.date)} ${clashes[0].a.start}，${safe(clashes[0].a.course.name)}与${safe(clashes[0].b.course.name)}重叠。请更换方案。</div>`:missing?`<div class="scheme-warning">仍有 ${missing} 节未安排，请选择课节完整的方案。</div>`:'<div class="scheme-warning ok">各科时段无冲突，可以生成多科目汇总课表。</div>';
        $('#schemeSummary').innerHTML=`<h2>方案合并预览</h2>${courses.map(course=>{const plan=planFor(course);return `<div class="scheme-summary-row"><small>${safe(course.name)} · ${safe(course.board)}</small><strong>${plan?safe(plan.teacher):'请选择方案'}</strong><em>${plan?plan.slots.length:0}/${course.required} 节 · ${plan?plan.slots.length*2:0} 课时</em></div>`}).join('')}<div class="scheme-summary-metrics"><div><strong>${rows.length}</strong><small>计划课节</small></div><div><strong>${missing}</strong><small>待安排</small></div><div><strong>${clashes.length}</strong><small>时间冲突</small></div></div>${message}<button type="button" class="scheme-confirm" id="schemeConfirm" ${clashes.length||missing?'disabled':''}>确认方案并生成预排课表</button><p class="scheme-summary-note">切换科目方案后，合并检查会立即更新；确认后按日期生成一张课表。</p>`;
      }
      const dialog=$('#schemeDialog');
      const findPlan=id=>courses.flatMap(course=>course.plans.map(plan=>({course,plan}))).find(item=>item.plan.id===id);
      const showDialog=(title,body,wide=false)=>{$('#schemeDialogTitle').textContent=title;$('#schemeDialogBody').innerHTML=body;dialog.classList.toggle('wide',wide);dialog.showModal()};
      document.addEventListener('click',event=>{
        const close=event.target.closest('[data-dialog-close]');if(close){dialog.close();return;}
        const teacher=event.target.closest('[data-teacher]');if(teacher){const {course,plan}=findPlan(teacher.dataset.teacher);showDialog('教师信息',`<div class="scheme-detail-grid"><div><small>教师姓名</small><strong>${safe(plan.teacher)}</strong></div><div><small>教师级别</small><strong>${safe(plan.level)}</strong></div><div><small>任职</small><strong>${safe(plan.role)}</strong></div><div><small>可授科目</small><strong>${safe(course.name)}</strong></div><div><small>授课模式</small><strong>${safe(course.mode)}</strong></div><div><small>授课风格</small><strong>${safe(plan.style)}</strong></div></div><p>这张卡片代表该教师为当前学生提供的本科目排课方案；具体可排日期见“查看全部可排时段”。</p>`);return;}
        const slots=event.target.closest('[data-slots]');if(slots){const {course,plan}=findPlan(slots.dataset.slots);showDialog(`${course.name} · ${plan.teacher} · 可排时段`,`<div class="scheme-table-wrap"><table class="scheme-table"><thead><tr><th>日期</th><th>星期</th><th>时间</th><th>课时</th><th>授课方式</th><th>校区</th></tr></thead><tbody>${plan.slots.map(([date,start,end])=>`<tr><td>${date}</td><td>${weekday(date)}</td><td>${start}—${end}</td><td>2 课时</td><td>${safe(course.mode)}</td><td>${safe(course.campus)}</td></tr>`).join('')}</tbody></table></div>`,true);return;}
        const select=event.target.closest('[data-select]');if(select){const found=findPlan(select.dataset.select);chosen[found.course.id]=found.plan.id;render();return;}
        if(event.target.id==='schemeConfirm'){const rows=lessons();if(conflicts(rows).length||courses.some(course=>planFor(course).slots.length<course.required))return;showDialog('多科目汇总预排课表',`<p style="margin:0 0 14px">陈同学 · 商务＋会计 · 共 ${rows.length} 节／${rows.length*2} 课时。各科方案时段已合并，按上课时间排序。</p><div class="scheme-table-wrap"><table class="scheme-table"><thead><tr><th>上课日期</th><th>星期</th><th>上课时间</th><th>课程</th><th>授课教师</th><th>授课方式</th><th>校区</th></tr></thead><tbody>${rows.map(row=>`<tr><td>${row.date}</td><td>${weekday(row.date)}</td><td>${row.start}—${row.end}</td><td>${safe(row.course.name)}</td><td>${safe(row.teacher)}</td><td>${safe(row.course.mode)}</td><td>${safe(row.course.campus)}</td></tr>`).join('')}</tbody></table></div>`,true);}
      });
      dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.close()});
      render();
    })();
  </script>
</body>
