<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>选择排课老师 · 教师组合演示</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #f4f7f6;
      --paper: #fff;
      --ink: #152721;
      --muted: #536761;
      --line: #dce6e1;
      --green: #00853c;
      --green-deep: #00672f;
      --tint: #e8f7ec;
      font: 14px/1.55 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--canvas); }
    button { font: inherit; cursor: pointer; }
    button:disabled { cursor: default; opacity: .5; }
    button:focus-visible, a:focus-visible { outline: 3px solid #4ca977; outline-offset: 3px; }
    a { color: var(--green-deep); }
    [hidden] { display: none !important; }
    .top { background: var(--paper); border-bottom: 1px solid var(--line); }
    .top-inner, main, .footer-inner { max-width: 1280px; padding-inline: 32px; margin: auto; }
    .top-inner { height: 62px; display: flex; align-items: center; gap: 14px; }
    .brand { display: grid; place-items: center; width: 29px; height: 29px; border-radius: 8px; background: #17372b; color: white; font-weight: 700; }
    .divider { color: #abbab2; }
    .top-label { color: var(--muted); }
    .workbench { margin-left: auto; font-size: 13px; text-decoration: none; }
    main { padding-block: 32px 110px; }
    .title-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; }
    h1 { margin: 0; font-size: clamp(25px, 4vw, 34px); font-weight: 720; line-height: 1.2; }
    h2, h3, p { margin: 0; }
    .subtitle { margin-top: 9px; color: var(--muted); }
    .button, .primary { border: 1px solid var(--line); border-radius: 8px; min-height: 39px; padding: 8px 14px; background: var(--paper); color: var(--ink); font-weight: 600; white-space: nowrap; }
    .button:hover { background: #edf4f0; }
    .primary { border-color: var(--green); background: var(--green); color: white; }
    .primary:not(:disabled):hover { background: var(--green-deep); }
    .summary { display: flex; flex-wrap: wrap; gap: 10px 28px; margin: 22px 0 25px; padding: 13px 17px; background: #eaf1ed; border-radius: 8px; }
    .summary span { color: var(--muted); }
    .summary b { color: var(--ink); margin-left: 5px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); gap: 16px; }
    .card { min-width: 0; display: flex; flex-direction: column; padding: 17px 14px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); }
    .card.recommended { border-color: #0a9e44; }
    .card.selected { box-shadow: 0 0 0 3px #00a14e25; border-color: var(--green); }
    .card-header, .card-status { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
    .card-header h2 { font-size: 18px; }
    .pill { display: inline-block; border-radius: 100px; padding: 2px 9px; font-size: 12px; line-height: 1.55; font-weight: 650; background: #edf1ef; color: #3d5048; }
    .pill.green { background: var(--tint); color: var(--green-deep); }
    .pill.warn { background: #fff3db; color: #855000; }
    .metrics { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; margin-top: 14px; color: var(--muted); font-size: 13px; }
    .total { color: var(--green-deep); font-size: 39px; line-height: 1; font-weight: 730; font-variant-numeric: tabular-nums; }
    .total small { font-size: 22px; margin-left: 2px; }
    .card-summary { margin: 8px 0 16px; color: var(--muted); font-size: 13px; }
    .card-table { table-layout: fixed; width: 100%; border-collapse: collapse; text-align: left; border-top: 1px solid var(--line); }
    .card-table th, .card-table td { padding: 10px 7px; border-bottom: 1px solid #edf1ef; vertical-align: top; }
    .card-table th { color: #365046; font-size: 12px; }
    .card-table th:first-child { width: 47px; }
    .card-table th:nth-child(3) { width: 25%; }
    .card-table th:last-child { width: 58px; }
    .card-table tr:last-child td { border-bottom: 0; }
    .card-table th:last-child, .card-table td:last-child { text-align: right; }
    .teacher { color: var(--green-deep); border: 0; padding: 0; font-weight: 650; text-align: left; background: none; }
    .teacher:hover, .link:hover { text-decoration: underline; }
    .teacher-id { color: var(--muted); font-size: 11px; margin-left: 4px; white-space: nowrap; }
    .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
    .tags .pill { font-weight: 500; padding: 1px 5px; font-size: 11px; }
    .dept, .submetric { display: block; font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
    .amount { font-variant-numeric: tabular-nums; font-weight: 650; white-space: nowrap; }
    .card-status { padding: 12px 0; margin-top: auto; }
    .link { border: 0; padding: 2px 0; background: none; color: var(--green-deep); }
    .card .choose { width: 100%; border-radius: 99px; }
    .recommended .choose, .selected .choose { background: var(--green); color: white; border-color: var(--green); }
    .reason { margin-top: 8px; color: var(--muted); font-size: 12px; }
    .section-bar { margin: 22px 0 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .section-bar h2 { font-size: 20px; }
    .scenario-controls { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
    .scenario-controls select { font: inherit; background: white; color: var(--ink); border: 1px solid var(--line); padding: 7px 9px; border-radius: 8px; }
    .comparison { border: 1px solid var(--line); border-radius: 12px; padding: 0 12px 8px; background: white; }
    .comparison .detail-table { margin-top: 0; min-width: 900px; }
    .comparison .detail-table th { white-space: normal; }
    .comparison td .link + .link { margin-left: 10px; }
    .comparison tr[aria-selected="true"] td { background: var(--tint); }
    .section-bar .reason { margin: 0; }
    .group-panel { padding: 12px 16px; background: white; border: 1px solid var(--line); border-radius: 10px; }
    .group-panel label { color: var(--muted); }
    .filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
    .filters .button { min-height: 34px; padding: 5px 11px; font-size: 13px; }
    .filters .button[aria-pressed="true"] { border-color: var(--green); background: var(--tint); color: var(--green-deep); }
    .empty { grid-column: 1 / -1; border: 1px solid var(--line); padding: 18px; border-radius: 10px; background: white; color: var(--muted); }
    .group-note { margin-top: 8px; }
    .footer { position: fixed; inset: auto 0 0; background: var(--paper); border-top: 1px solid var(--line); }
    .footer-inner { min-height: 68px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    #selection { color: var(--muted); }
    dialog { width: min(820px, calc(100% - 30px)); max-height: 88dvh; padding: 0; border-radius: 14px; border: 1px solid var(--line); color: var(--ink); box-shadow: 0 18px 90px #142b2438; }
    dialog::backdrop { background: #15272167; }
    .dialog-header, .dialog-footer { padding: 14px 20px; display: flex; align-items: center; gap: 12px; justify-content: space-between; border-bottom: 1px solid var(--line); }
    .dialog-header { position: sticky; top: 0; background: white; z-index: 1; }
    .dialog-header h2 { font-size: 18px; }
    .dialog-footer { justify-content: flex-end; border-top: 1px solid var(--line); border-bottom: 0; }
    .close { border: 0; background: none; padding: 0 5px; font-size: 25px; color: var(--muted); }
    .dialog-body { padding: 18px 20px; }
    .dialog-body p + p { margin-top: 9px; }
    .detail-grid { margin: 0 0 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 9px; }
    .field { padding: 10px 12px; border-bottom: 1px solid var(--line); }
    .field dt { color: var(--muted); font-size: 12px; }
    .field dd { margin: 3px 0 0; overflow-wrap: anywhere; }
    details { margin: 12px 0; }
    details summary { cursor: pointer; font-weight: 600; color: var(--green-deep); }
    .scroll { overflow-x: auto; }
    .detail-table { width: 100%; border-collapse: collapse; text-align: left; margin-top: 10px; }
    .detail-table th, .detail-table td { border-bottom: 1px solid var(--line); padding: 7px 9px; white-space: nowrap; }
    .detail-table th { background: #edf5ef; color: #334b3d; }
    @media (max-width: 550px) {
      .top-inner, main, .footer-inner { padding-inline: 13px; }
      main { padding-top: 21px; }
      .title-row { flex-wrap: wrap; }
      .summary { gap: 5px 14px; }
      .card { padding: 13px 11px; }
      .card-table th:first-child { width: 45px; }
      .card-table th:last-child { width: 56px; }
      .card-table th, .card-table td { padding-inline: 4px; }
      .teacher-id { display: block; margin-left: 0; }
      .detail-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .footer-inner { padding-block: 9px; }
      #selection { font-size: 12px; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <span class="brand" aria-hidden="true">排</span><strong>教务工作台</strong><span class="divider" aria-hidden="true">/</span><span class="top-label">智能排课</span>
      <a class="workbench" href="./教务端/index.html">返回工作台</a>
    </div>
  </header>
  <main>
    <div class="title-row">
      <div><h1>选择排课老师</h1><p class="subtitle">选择一套教师组合，一次确认数学、物理和化学的授课老师。</p></div>
      <button type="button" class="button" id="strategy">查看排课策略</button>
    </div>
    <div class="summary" aria-label="排课要求概览">
      <span>待排<b>3 门课程 · 30 节</b></span>
      <span>本组最佳<b id="best"></b></span>
      <span>上课时区<b>中国 · 北京</b></span>
      <label class="scenario-controls" for="scenario">演示场景
        <select id="scenario">
          <option value="multiple" selected>数学指定 5 位备选</option>
          <option value="single">数学已指定 1 位老师</option>
          <option value="two-fixed">数学、化学各固定 1 位</option>
          <option value="two-multiple">数学、化学各指定 2 位备选</option>
          <option value="automatic">全单系统推荐</option>
        </select>
      </label>
    </div>
    <div class="group-panel" id="group-panel">
      <div class="scenario-controls"><label for="group">指定教师搭配</label><select id="group"></select></div>
      <p id="group-note" class="reason group-note"></p>
    </div>
    <div class="section-bar"><h2>整单推荐</h2><p class="reason" id="recommendation-note" aria-live="polite"></p></div>
    <nav id="filters" class="filters" aria-label="按方案类型筛选"></nav>
    <section id="combinations" class="grid" aria-label="推荐教师组合"></section>
    <section id="comparison" aria-labelledby="compareTitle">
      <div class="section-bar"><h2 id="compareTitle">指定教师试排对比</h2><p class="reason">各行固定本行的指定教师，点击切换到该组的完整方案。</p></div>
      <div class="comparison scroll">
        <table class="detail-table">
          <thead><tr><th scope="col">数学老师</th><th scope="col" id="other-teacher-label">组织架构</th><th scope="col">数学原要求<br>时段覆盖度</th><th scope="col">放宽后数学<br>模拟可排</th><th scope="col">全单<br>模拟可排</th><th scope="col">放宽项或缺口</th><th scope="col">操作</th></tr></thead>
          <tbody id="comparison-rows"></tbody>
        </table>
      </div>
    </section>
  </main>
  <footer class="footer">
    <div class="footer-inner">
      <span id="selection" aria-live="polite">请选择一套教师组合</span>
      <button class="primary" id="confirm" type="button" disabled>确认教师组合</button>
    </div>
  </footer>
  <dialog id="detail" aria-labelledby="dialogTitle">
    <div class="dialog-header"><h2 id="dialogTitle"></h2><button class="close" aria-label="关闭" id="close" type="button">×</button></div>
    <div class="dialog-body" id="dialogBody"></div>
    <div class="dialog-footer" id="dialogFooter"></div>
  </dialog>
  <script>
    const courses = [
      { name: '数学', full: 'ALEVEL-数学-AQA-AS-线上', mode: '线上', campus: '—', target: 10 },
      { name: '物理', full: 'ALEVEL-物理-CAIE-AS-线下', mode: '线下', campus: '舜元中心', target: 10 },
      { name: '化学', full: 'ALEVEL-化学-CAIE-AS-线上', mode: '线上', campus: '—', target: 10 },
    ];
    const staff = {
      wang: { name: '王老师', id: 'VA000755', org: 'A 架构', dept: '英联邦浦西中心 · 班课教学部', status: '引导', courseStatus: '可排', source: '当前授课老师', level: '资深', gender: '男', type: '全职', style: '突出重点、讲解细致', load: '131.25 / 160', coverage: '10/10', metric: '固定时段覆盖', slotCoverage: '4/4' },
      zhang: { name: '张老师', id: 'VA001968', org: 'A 架构', dept: '英联邦浦西中心 · 班课教学部', status: '可排', courseStatus: '可排', source: '系统推荐', level: '高级', gender: '女', type: '全职', style: '循序渐进、课堂互动', load: '138 / 160', coverage: '10/10', metric: '优先时段覆盖', slotCoverage: '5/5' },
      li: { name: '李老师', id: 'VA001736', org: 'A 架构', dept: '英联邦浦西中心 · 班课教学部', status: '可排', courseStatus: '可排', source: '系统推荐', level: '高级', gender: '女', type: '全职', style: '思路清晰、善于归纳', load: '124 / 160', coverage: '9/10', metric: '候选时段覆盖', slotCoverage: '9/10' },
      zhao: { name: '赵老师', id: 'VA000144', org: 'B 架构', dept: '英联邦浦东中心 · 教学部', status: '可排', courseStatus: '可排', source: '系统推荐', level: '资深', gender: '男', type: '全职', style: '讲解细致、方法归纳', load: '126 / 160', coverage: '10/10', metric: '固定时段覆盖', slotCoverage: '4/4' },
      wu: { name: '吴老师', id: 'VA002413', org: 'B 架构', dept: '英联邦浦东中心 · 教学部', status: '可排', courseStatus: '可排', source: '系统推荐', level: '高级', gender: '男', type: '全职', style: '启发式、注重应用', load: '119 / 160', coverage: '10/10', metric: '优先时段覆盖', slotCoverage: '5/5' },
      chen: { name: '陈老师', id: 'VA002206', org: 'B 架构', dept: '英联邦浦东中心 · 教学部', status: '可排', courseStatus: '待审批', source: '系统推荐', level: '高级', gender: '女', type: '全职', style: '重点明确、反馈及时', load: '120 / 160', coverage: '10/10', metric: '候选时段覆盖', slotCoverage: '10/10', approval: '选用该老师需由所属教学部门负责人审批。' },
    };
    staff.lin = { ...staff.zhao, name: '林老师', id: 'VA002510', coverage: '7/10', slotCoverage: '3/4' };
    staff.qiu = { ...staff.wang, name: '邱老师', id: 'VA002511', status: '可排', source: '系统推荐', coverage: '6/10', slotCoverage: '2/4' };
    staff.xu = { ...staff.zhao, name: '许老师', id: 'VA002512', status: '停排', courseStatus: '不可排', coverage: '—', slotCoverage: '—' };
    staff.lu = { ...staff.chen, name: '陆老师', id: 'VA002513', courseStatus: '可排', approval: '' };
    staff.han = { ...staff.wang, name: '韩老师', id: 'VA002514', source: '系统推荐' };
    staff.qian = { ...staff.zhao, name: '钱老师', id: 'VA002515' };
    staff.sun = { ...staff.zhang, name: '孙老师', id: 'VA002516' };
    staff.gao = { ...staff.wu, name: '高老师', id: 'VA002517' };
    staff.he = { ...staff.li, name: '何老师', id: 'VA002518', coverage: '10/10', slotCoverage: '10/10' };
    const sharedPlans = [
      { id: 'A', teachers: ['wang','wu','li'], counts: [10,10,9] },
      { id: 'B', teachers: ['zhao','wu','lu'], counts: [10,10,10] },
      { id: 'C', teachers: ['wang','zhang','li'], counts: [10,9,9] },
    ];
    const comparisons = [
      { key: 'wang', original: 9, moved: 1, count: 10 },
      { key: 'zhao', original: 8, moved: 2, count: 10 },
      { key: 'lin', original: 7, moved: 2, count: 9 },
      { key: 'qiu', original: 6, moved: 2, count: 8 },
      { key: 'xu', blocker: '教师排课状态为停排' },
    ];
    const get = id => document.getElementById(id);
    const total = combination => combination.counts.reduce((sum, count) => sum + count, 0);
    const goal = courses.reduce((sum, course) => sum + course.target, 0);
    const onFloor = plan => plan.counts.every(count => count >= 9);
    const strategyNames = ['均衡', '排课量优先', '教师架构优先'];
    const automaticPlans = sharedPlans.map(plan => ({
        ...plan,
        teachers: [plan.teachers[0] === 'wang' ? 'han' : 'qian', ...plan.teachers.slice(1)],
    }));
    automaticPlans.push(
      { id: 'D', teachers: ['han','sun','he'], counts: [10,10,9] },
      { id: 'E', teachers: ['qian','gao','lu'], counts: [10,10,10] },
    );
    const scenarioOptions = {
      multiple: [comparisons, [null]],
      single: [[comparisons[0]], [null]],
      'two-fixed': [[comparisons[0]], ['li']],
      'two-multiple': [comparisons.slice(0, 2), ['li','lu']],
    };

    function makeGroups(scenario) {
      if (scenario === 'automatic') return [{ id: 'automatic', plans: automaticPlans }];
      const [mathTeachers, chemTeachers] = scenarioOptions[scenario];
      return mathTeachers.flatMap(math => chemTeachers.map(chem => {
        const name = `数学 ${staff[math.key].name}${chem ? ' ＋ 化学 ' + staff[chem].name : ''}`;
        const variants = [
          ['wu','lu',10,10], ['gao','lu',10,10],
          ['wu','li',10,9], ['zhang','li',9,9], ['sun','he',9,9],
        ];
        const fixedChemVariants = ['wu','gao','zhang','sun'].map((physics, index) =>
          [physics,chem,index < 2 ? 10 : 9,chem === 'li' ? 9 : 10]);
        const plans = math.blocker ? [] : (chem ? fixedChemVariants : variants).map(([physics, chemistry, p, c], index) => ({
          id: String.fromCharCode(65 + index),
          teachers: [math.key,physics,chemistry],
          counts: [math.count,p,c],
        }));
        return { id: `${math.key}-${chem || 'open'}`, math, chem, name, plans };
      }));
    }

    const dialog = get('detail');
    let groups = makeGroups(get('scenario').value);
    let activeGroup = groups[0];
    let activeStrategy = '';
    let selected = null;
    let confirmed = null;
    const label = (value, tone = '') => `<span class="pill ${tone}">${value}</span>`;
    const findPlan = id => activeGroup.plans.find(plan => plan.id === id);
    const byAmount = (a, b) => total(b) - total(a);
    const byArchitecture = (a, b) => architectureCost(a) - architectureCost(b);
    const byWorstCourse = (a, b) => Math.min(...b.counts) - Math.min(...a.counts);
    const architectureCost = plan => plan.teachers.filter(key => staff[key].org === 'B 架构').length;
    const recommendable = plan => onFloor(plan) && !plan.teachers.some(key => staff[key].approval);

    function recommendationCards(plans) {
      const qualified = plans.filter(recommendable);
      const quantity = [...qualified].sort((a,b) => byAmount(a,b) || byWorstCourse(a,b) || byArchitecture(a,b));
      const best = quantity.length ? total(quantity[0]) : null;
      const balanced = qualified.filter(plan => best - total(plan) <= 1 && (best - total(plan)) * 100 <= best * 5)
        .sort((a,b) => byArchitecture(a,b) || byWorstCourse(a,b) || byAmount(a,b));
      const architecture = [...qualified].sort((a,b) => byArchitecture(a,b) || byAmount(a,b) || byWorstCourse(a,b));
      const ranked = [balanced,quantity,architecture].map(list => list.slice(0, 2));
      const cards = new Map();
      for (const [index, list] of ranked.entries()) {
        for (const plan of list) {
          if (!cards.has(plan)) cards.set(plan, []);
          cards.get(plan).push(strategyNames[index]);
        }
      }
      return { cards, best, ranked };
    }

    function sourceFor(teacher, index) {
      if (index === 0 && activeGroup.math) return groups.some(group => group.math.key !== activeGroup.math.key) ? '指定备选' : '已指定';
      if (index === 2 && activeGroup.chem) return groups.some(group => group.chem !== activeGroup.chem) ? '指定备选' : '已指定';
      return teacher.source;
    }

    function planWarnings(plan) {
      const gaps = plan.counts.flatMap((count, index) => count < courses[index].target
        ? [`${courses[index].name}待补 ${courses[index].target - count} 节`] : []);
      const approvals = plan.teachers.flatMap((key, index) => staff[key].approval
        ? [`${courses[index].name} ${plan.counts[index]} 节待审批`] : []);
      return [...(onFloor(plan) ? [] : ['低于质量底线']), ...gaps, ...approvals];
    }

    function planOrder(cards) {
      return cards.size ? [...cards.keys()] : activeGroup.plans;
    }

    function planName(plan, orderedPlans) {
      const index = orderedPlans.indexOf(plan);
      return '方案' + (['一','二','三','四','五','六','七','八','九','十'][index] || index + 1);
    }

    function textPlanName(plan) {
      return planName(plan, planOrder(recommendationCards(activeGroup.plans).cards));
    }

    function renderCard(combination, badges, best, orderedPlans) {
      const lead = badges.includes('均衡');
      const picked = selected === combination;
      const ready = confirmed === combination;
      const loss = best === null ? null : (best - total(combination)) * 100 / best;
      const rows = combination.teachers.map((key, index) => {
        const teacher = staff[key];
        return `<tr>
          <td><strong>${courses[index].name}</strong></td>
          <td><button type="button" class="teacher" data-teacher="${key}" data-course="${index}">${teacher.name}</button><span class="teacher-id">${teacher.id}</span>
            <div class="tags">${label('老师 · ' + teacher.status, 'green')}${label('课程 · ' + teacher.courseStatus, teacher.approval ? 'warn' : '')}${sourceFor(teacher, index) === '系统推荐' ? '' : label(sourceFor(teacher, index))}</div>
          </td>
          <td>${teacher.org}<small class="dept">${teacher.dept}</small></td>
          <td><span class="amount">${combination.counts[index]}/${courses[index].target}</span><small class="submetric">课节覆盖</small></td>
        </tr>`;
      }).join('');
      return `<article class="card ${lead ? 'recommended' : ''} ${picked ? 'selected' : ''}" aria-labelledby="title-${combination.id}">
        <div class="card-header"><h2 id="title-${combination.id}">${planName(combination, orderedPlans)}</h2><div>${badges.map(badge => label(badge, badge === '均衡' ? 'green' : '')).join(' ')}</div></div>
        <div class="metrics"><strong class="total">${total(combination)}<small>节</small></strong><span>${best === null ? '/ ' + goal + ' 节待排' : '/ ' + best + ' 节本组最佳'}</span></div>
        <p class="card-summary">${3 - architectureCost(combination)} 位 A 架构 · ${architectureCost(combination)} 位 B 架构${loss === null ? '' : ' · 与本组最佳相差 ' + loss.toFixed(1) + '%'}</p>
        <table class="card-table"><thead><tr><th scope="col">科目</th><th scope="col">教师</th><th scope="col">架构</th><th scope="col">可排</th></tr></thead><tbody>${rows}</tbody></table>
        <div class="card-status"><div>${recommendable(combination) ? label('符合质量底线', 'green') : label('部分方案', 'warn')} ${planWarnings(combination).map(warning => label(warning)).join(' ')}</div><button class="link" type="button" data-preview="${combination.id}">查看模拟课表</button></div>
        <button type="button" class="button choose" data-select="${combination.id}" aria-pressed="${picked}">${ready ? '已确认该组合' : picked ? '已选择该组合' : '选择该组合'}</button>
      </article>`;
    }

    function renderComparison() {
      get('comparison').hidden = !activeGroup.math;
      if (!activeGroup.math) return;
      get('other-teacher-label').textContent = activeGroup.chem ? '化学老师' : '组织架构';
      get('comparison-rows').innerHTML = groups.map(group => {
        const item = group.math;
        const teacher = staff[item.key];
        const { ranked } = recommendationCards(group.plans);
        const plan = ranked[0][0] || [...group.plans].sort(byAmount)[0];
        const picked = group === activeGroup;
        const warning = plan ? planWarnings(plan).join('、') : item.blocker;
        const original = plan ? `${item.original}/10 节 · ${item.original * 10}%` : '—';
        return `<tr aria-selected="${Boolean(picked)}">
          <td><button type="button" class="teacher" data-teacher="${item.key}" data-course="0">${teacher.name}</button><span class="teacher-id">${teacher.id}</span></td>
          <td>${group.chem ? `<button type="button" class="teacher" data-teacher="${group.chem}" data-course="2">${staff[group.chem].name}</button>` : teacher.org}</td><td>${original}</td><td>${plan ? plan.counts[0] + '/10 节' : '—'}</td>
          <td>${plan ? total(plan) + '/' + goal + ' 节' : '—'}</td>
          <td>${plan ? '数学 ' + item.moved + ' 节由周四改到周二' : item.blocker}<small class="submetric">${plan ? warning || '无缺口' : '不可选择'}</small></td>
          <td><button class="link" type="button" data-group="${group.id}" aria-pressed="${picked}">${picked ? '正在查看本组' : '查看本组方案'}</button></td>
        </tr>`;
      }).join('');
    }

    function renderSelection() {
      const { cards, best, ranked } = recommendationCards(activeGroup.plans);
      get('best').textContent = best === null ? '暂无达标方案' : `${best} 节`;
      get('group-panel').hidden = !activeGroup.math;
      get('group').innerHTML = groups.map(group => `<option value="${group.id}" ${group === activeGroup ? 'selected' : ''}>${group.name || '全单系统推荐'}</option>`).join('');
      get('group-note').textContent = activeGroup.math
        ? `${groups.length} 个指定搭配 · 本组各方案都使用 ${activeGroup.name}`
        : '';
      get('recommendation-note').textContent = cards.size ? `本组 ${cards.size} 套方案 · 同一方案可归入多种类型` : '本组暂无达标推荐';
      const filters = [['','全部',cards.size || activeGroup.plans.length], ...strategyNames.map((name, index) => [name,name,ranked[index].length])];
      get('filters').innerHTML = filters.map(([filter, name, count]) =>
        `<button type="button" class="button" data-filter="${filter}" aria-pressed="${filter === activeStrategy}">${name} ${count}</button>`).join('');
      const orderedPlans = planOrder(cards);
      const display = activeStrategy ? ranked[strategyNames.indexOf(activeStrategy)] : orderedPlans;
      get('combinations').innerHTML = display.map(plan => renderCard(plan, cards.get(plan) || [], best, orderedPlans)).join('')
        || `<p class="empty">${activeGroup.math?.blocker || '本组该类型暂无方案。'}</p>`;
      renderComparison();
      get('selection').textContent = selected
        ? `${selected === confirmed ? '已确认' : '已选择'} · ${selected.teachers.map(key => staff[key].name).join('、')} · ${total(selected)}/${goal} 节模拟可排`
        : '请选择一套教师组合';
      const button = get('confirm');
      button.disabled = !selected;
      button.textContent = selected && selected === confirmed ? '查看演示预排' : '确认教师组合';
    }

    function showDialog(title, markup, footer = '<button class="button" type="button" data-dismiss>关闭</button>') {
      get('dialogTitle').textContent = title;
      get('dialogBody').innerHTML = markup;
      get('dialogFooter').innerHTML = footer;
      dialog.showModal();
    }

    function teacherInfo(key, index) {
      const teacher = staff[key];
      const course = courses[index];
      const fields = [
        ['工号',teacher.id],['教师级别',teacher.level],['教师性别',teacher.gender],['教师类型',teacher.type],
        ['所属校区',course.campus],['所属部门',teacher.dept],['组织架构',teacher.org],['教师来源',sourceFor(teacher, index)],
        ['授课科目',course.full],['排课状态',teacher.status],['课程排课状态',teacher.courseStatus],['授课方式',course.mode],
        ['课时负载（课时）',teacher.load],['授课风格',teacher.style],['备注',teacher.approval || '—'],
        ['总课节覆盖',teacher.coverage],[teacher.metric,teacher.slotCoverage],
      ];
      const months = Array.from({ length: 12 }, (_, index) => `<th scope="col">${index + 1}月</th>`).join('');
      const loads = Array.from({ length: 12 }, (_, index) => `<td>${index === 10 ? teacher.load : '—'}</td>`).join('');
      showDialog(`教师信息 · ${teacher.name}`,
        `<dl class="detail-grid">${fields.map(([name,value]) => `<div class="field"><dt>${name}</dt><dd>${value}</dd></div>`).join('')}</dl>
         <details><summary>排课标签</summary><div class="tags">${label('可带试听')}${label('可带诊断')}${label('可带自组班')}</div></details>
         <details open><summary>2026 年课时负载</summary><div class="scroll"><table class="detail-table"><thead><tr><th scope="col">月份</th>${months}</tr></thead><tbody><tr><th scope="row">已排 / 上限</th>${loads}</tr></tbody></table></div></details>`);
    }

    function scheduleRows(combination) {
      const start = Date.UTC(2026, 10, 23);
      const starts = ['10:30','13:30','16:00'];
      const ends = ['12:30','15:30','18:00'];
      const moved = activeGroup.math?.moved || 0;
      const rows = courses.flatMap((course, index) =>
        Array.from({ length: combination.counts[index] }, (_, lessonIndex) => {
          const week = Math.floor(lessonIndex / 2);
          const thursday = lessonIndex % 2 === 1;
          const relaxed = index === 0 && thursday && week < moved;
          const day = relaxed ? 1 : thursday ? 3 : 0;
          const date = new Date(start + (week * 7 + day) * 86400000).toISOString().slice(0, 10);
          return { date, index, relaxed, course };
        })
      );
      return rows.sort((a,b) => a.date.localeCompare(b.date) || a.index - b.index).map(({date,index,relaxed,course}) =>
        `<tr><td>${date}</td><td>${starts[index]}–${ends[index]}</td><td>${course.name}</td><td>${staff[combination.teachers[index]].name}</td><td>${course.mode}</td><td>${course.campus}</td><td>${relaxed ? '周四调整至周二' : '—'}</td></tr>`
      ).join('');
    }

    function showSchedule(combination, formal = false) {
      const warnings = planWarnings(combination);
      showDialog(`${textPlanName(combination)} · ${formal ? '演示预排' : '模拟课表'}`,
        `<p><strong>${total(combination)}/${goal} 节</strong> · ${warnings.join('、') || '各科均已排足'}</p>
         ${formal ? '<p>此处演示确认后的预排入口，课表使用示例数据。</p>' : ''}
         <div class="scroll"><table class="detail-table"><thead><tr><th scope="col">日期</th><th scope="col">上课时间</th><th scope="col">科目</th><th scope="col">授课教师</th><th scope="col">授课模式</th><th scope="col">校区</th><th scope="col">放宽项</th></tr></thead>
         <tbody id="timetable">${scheduleRows(combination)}</tbody></table></div>`);
    }

    function changeGroup(group) {
      activeGroup = group;
      activeStrategy = '';
      selected = null;
      confirmed = null;
      renderSelection();
    }

    document.querySelector('main').addEventListener('click', event => {
      const button = event.target.closest('button');
      if (!button) return;
      const { teacher, course, preview, select, group, filter } = button.dataset;
      if (group) {
        changeGroup(groups.find(item => item.id === group));
        get('group').focus();
        get('group-panel').scrollIntoView({ block: 'nearest' });
      }
      if (filter !== undefined) {
        activeStrategy = filter;
        renderSelection();
        get('filters').querySelector('[aria-pressed="true"]').focus({ preventScroll: true });
      }
      if (teacher) teacherInfo(teacher, Number(course));
      if (preview) showSchedule(findPlan(preview));
      if (select) {
        const parent = button.closest('#comparison') || get('combinations');
        selected = findPlan(select);
        if (selected !== confirmed) confirmed = null;
        renderSelection();
        parent.querySelector(`[data-select="${select}"]`)?.focus({ preventScroll: true });
      }
    });
    get('scenario').addEventListener('change', () => {
      groups = makeGroups(get('scenario').value);
      changeGroup(groups[0]);
    });
    get('group').addEventListener('change', event => changeGroup(groups.find(group => group.id === event.target.value)));
    get('strategy').addEventListener('click', () => showDialog('排课策略',
      '<p>数学、物理和化学各需 10 节。每个指定教师搭配独立筛选，组内各方案固定本组指定老师，只调整未指定科目。</p><p><strong>均衡方案</strong>允许比本组最佳少排 1 节且不超过 5%。<strong>排课量优先方案</strong>先比较总节数。<strong>教师架构优先方案</strong>达到质量底线后先比较架构。Demo 每种类型展示最多两套，同一套可有多个类型。</p><p>示例质量底线为每科至少 9 节且无需待定审批。指定数学老师时，示例允许部分数学课从周四调整至周二。</p>'));
    get('confirm').addEventListener('click', () => {
      if (selected === confirmed) {
        showSchedule(selected, true);
        return;
      }
      const names = selected.teachers.map((key, index) => `${courses[index].name} ${staff[key].name}`).join('、');
      const warnings = planWarnings(selected);
      const relaxed = activeGroup.math?.moved;
      showDialog(`确认${textPlanName(selected)}`, `<p>${names}</p><p>模拟可排 ${total(selected)}/${goal} 节。确认后查看演示预排。</p>
        ${relaxed ? `<p>数学有 ${relaxed} 节使用放宽时段。</p>` : ''}${warnings.length ? `<p>${warnings.join('、')}。</p>` : ''}`,
        '<button class="button" type="button" data-dismiss>取消</button><button class="primary" type="button" data-confirm>确认并查看预排</button>');
    });
    get('close').addEventListener('click', () => dialog.close());
    dialog.addEventListener('click', event => {
      if (event.target.closest('[data-dismiss]')) dialog.close();
      if (event.target.closest('[data-confirm]')) {
        confirmed = selected;
        dialog.close();
        renderSelection();
        showSchedule(confirmed, true);
      }
    });
    renderSelection();
  </script>
</body>
</html>
